name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: praha-poseidon/static-extract-spec
          path: static-extract-spec
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Place sibling spec
        run: |
          # CI workspace is the java repo; checkout puts spec as sibling path
          ls -la
          test -f ../static-extract-spec/ser/Ser.g4 || test -f static-extract-spec/ser/Ser.g4
          if [ -d static-extract-spec ] && [ ! -d ../static-extract-spec ]; then
            mkdir -p ..
            # pom expects ../../static-extract-spec from core → repo-root/../static-extract-spec
            # From GITHUB_WORKSPACE (java root), sibling is $GITHUB_WORKSPACE/../static-extract-spec
            ln -sfn "$GITHUB_WORKSPACE/static-extract-spec" "$GITHUB_WORKSPACE/../static-extract-spec"
          fi
          ls -la "$GITHUB_WORKSPACE/../static-extract-spec/ser"
      - run: mvn -B test
